<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>دفتَرچه</title>
  <!-- The mark the installed app icons use, in vector: a green felt squircle,
       a pair of calm eyes under soft brows, a gentle smile, a dark-green front
       pocket and the folded terracotta note peeking out above it. Same geometry
       as the raster icons in this folder, so the tab, the home screen and the
       app agree. -->
  <rect width="64" height="64" rx="16" fill="#6D9B79"/>

  <!-- The folded terracotta note, rising from behind the pocket's top edge. -->
  <path fill="#E97845" d="M33 43V40q0-2 2-2h10q2 0 2 2v3z"/>
  <path fill="#D06030" d="M43 38h2q2 0 2 2v2z"/>

  <!-- Front pocket on the lower half. -->
  <path fill="#5C8A68" stroke="#173B32" stroke-width="2.5" stroke-linejoin="round"
        d="M16 43h32v8q0 5-5 5H21q-5 0-5-5z"/>

  <!-- Brows. -->
  <path fill="none" stroke="#173B32" stroke-width="2.2" stroke-linecap="round"
        d="M17.5 21q5.5-3.2 11-.6"/>
  <path fill="none" stroke="#173B32" stroke-width="2.2" stroke-linecap="round"
        d="M35.5 20.4q5.5-3.2 11 .6"/>

  <!-- Smile. -->
  <path fill="none" stroke="#173B32" stroke-width="2.2" stroke-linecap="round"
        d="M26 33.5q6 3.6 12 0"/>

  <!-- Eyes and their specular highlights. -->
  <circle cx="23" cy="28" r="4.1" fill="#173B32"/>
  <circle cx="41" cy="28" r="4.1" fill="#173B32"/>
  <circle cx="21.8" cy="26.6" r="1.5" fill="#F5F0E6"/>
  <circle cx="39.8" cy="26.6" r="1.5" fill="#F5F0E6"/>
</svg>
